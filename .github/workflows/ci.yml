name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component clippy,rustfmt

      - name: Cache Cargo data
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-1.85.1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting
        run: cargo +1.85.1 fmt --all --check

      - name: Run Clippy
        run: cargo +1.85.1 clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo +1.85.1 test --workspace --all-targets --all-features --locked

      - name: Build release binary
        run: cargo +1.85.1 build --release --package rs-console-server --locked

      - name: Install cargo-deny
        run: cargo +1.85.1 install cargo-deny --version 0.18.3 --locked

      - name: Audit dependencies
        run: cargo +1.85.1 deny check

  container:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build ARM64 runtime image
        run: docker build --tag rs-console:test .
